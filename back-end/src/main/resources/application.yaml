server:
  port: 8081

spring:
  application:
    name: back-end
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
        temperature: 1.0
        max-tokens: 400

    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        temperature: 0.7

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
