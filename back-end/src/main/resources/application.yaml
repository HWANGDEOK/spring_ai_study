server:
  port: 8081

spring:
  application:
    name: back-end
  config:
    import: classpath:application-secret.yaml
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
        temperature: 1.0
        max-tokens: 400
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      mariadb:
        initialize-schema: true
        tablename: vector_store
        dimensions: 1536
        distance-type-string: COSINE


    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        temperature: 0.7




logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
